name: Aura Brawl Derleyici

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Android NDK
      run: |
        echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"

    - name: Build C++ Library with NDK
      run: |
        cd app/src/main/jni
        ${ANDROID_HOME}/ndk/25.1.8937393/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a

    - name: Upload Bitmis SO Dosyasi
      uses: actions/upload-artifact@v3
      with:
        name: AuraBrawl-arm64-v8a
        path: app/src/main/jni/libs/arm64-v8a/libAuraBrawl.so
        
